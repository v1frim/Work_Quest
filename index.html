<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e20">
<title>Work Quest — трекер робочих задач</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   A. ТОКЕНИ
   Уся палітра — тут і тільки тут. В еталонному проєкті :root-змінних не було
   зовсім, і кольори жили hex-літералами в 1500 рядках; через це шкала XP і
   оверлей святкування розійшлись у відтінках срібла й золота.
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  /* — акцент (золото) — */
  --gold:        #ffd166;
  --gold-hi:     #ffe08a;
  --gold-lo:     #ffc94d;
  --gold-pale:   #ffe9a8;
  --gold-deep:   #d99b2b;
  --on-gold:     #1a1206;
  --grad-gold:   linear-gradient(180deg, #ffe08a, #ffc94d);
  --grad-title:  linear-gradient(180deg, #ffe9a8, #ffd166 55%, #d99b2b);

  /* — статуси — */
  --st-done:     #7be07b;
  --st-active:   #87b4ff;
  --st-new:      #ffa94d;
  --st-fail:     #ff6b6b;
  --st-gain:     #06d6a0;
  --st-gain-bg:  rgba(6,214,160,0.16);

  /* — поверхні — */
  --surface-card:  linear-gradient(165deg, rgba(16,20,42,0.92), rgba(9,12,26,0.90));
  --surface-fixed: linear-gradient(165deg, rgba(14,18,38,0.90), rgba(8,11,24,0.88));
  --surface-sheet: linear-gradient(165deg, rgba(15,19,40,0.985), rgba(9,12,26,0.985));
  /* ⚠️ СОЛІД, не скло: на світлих фазах доби напівпрозорі кнопки вимиваються
     у невидимість. Кольорові кнопки = тінт ПОВЕРХ цієї підкладки. */
  --solid-btn:     rgba(10,14,30,0.92);
  --solid-btn-hov: rgba(42,38,20,0.95);
  --scrim:         rgba(4,6,14,0.78);

  /* — межі — */
  --bd-card:   1px solid rgba(255,209,102,0.30);
  --bd-fixed:  1px solid rgba(255,209,102,0.28);
  --bd-accent: 1px solid rgba(255,209,102,0.28);
  --bd-row:    1px solid rgba(255,255,255,0.08);
  --bd-cell:   1px solid rgba(255,255,255,0.14);
  --bd-chip:   1px solid rgba(255,255,255,0.18);
  --bd-ghost:  1px solid rgba(255,255,255,0.11);

  /* — текст: шкала прозорості дає ієрархію без нових кольорів — */
  --tx:   #fff;
  --tx-1: rgba(255,255,255,0.90);
  --tx-2: rgba(255,255,255,0.72);
  --tx-3: rgba(255,255,255,0.62);
  --tx-4: rgba(255,255,255,0.50);
  --tx-5: rgba(255,255,255,0.42);
  --tx-6: rgba(255,255,255,0.35);

  /* — тіні — */
  --sh-card:  0 24px 60px rgba(0,0,0,0.65),
              inset 0 1px 0 rgba(255,209,102,0.14),
              inset 0 0 60px rgba(255,209,102,0.03);
  --sh-fixed: 0 12px 34px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,209,102,0.12);
  --sh-cta:   0 6px 22px rgba(255,201,77,0.35);
  --sh-glow:  0 0 16px rgba(255,209,102,0.35);

  /* — радіуси — */
  --r-card: 20px; --r-box: 14px; --r-btn: 12px; --r-sm: 8px; --r-pill: 999px;

  /* — геометрія. ⚠️ Міняєш --w-left → перерахуй --balance (= --w-left − --w-right),
       інакше центральна картка з'їде вбік. — */
  --gap-col:   24px;
  --pad-page:  20px;
  --pad-card:  30px 32px;
  --pad-panel: 20px 20px;
  --w-card:    460px;
  --w-left:    440px;
  --w-right:   420px;
  --balance:   20px;
  --shift:     222px;
  --fix-inset: 18px;

  /* — час — */
  --t-fast:  0.15s;
  --t-press: 0.1s;
  --t-data:  0.6s;
}

/* ═══════════════════════════════════════════════════════════════════════════
   B. RESET + ФОН
   ═══════════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }

/* Фон — на <body>, як в еталоні: браузер propagate'ить його на все полотно,
   бо <html> власного фону не має. ⚠️ Якщо колись задаси background на <html> —
   propagation вимкнеться і фон малюватиметься лише в межах body. */
body {
  margin: 0;
  padding: var(--pad-page);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--tx);
  background:
    /* зорі */
    radial-gradient(1.6px 1.6px at 12% 22%, rgba(255,255,255,0.9), transparent 60%),
    radial-gradient(1.2px 1.2px at 28% 64%, rgba(255,255,255,0.7), transparent 60%),
    radial-gradient(2px   2px   at 43% 12%, rgba(255,255,255,0.85), transparent 60%),
    radial-gradient(1.3px 1.3px at 58% 46%, rgba(255,255,255,0.6), transparent 60%),
    radial-gradient(1.7px 1.7px at 71% 80%, rgba(255,255,255,0.75), transparent 60%),
    radial-gradient(1.2px 1.2px at 84% 28%, rgba(255,255,255,0.7), transparent 60%),
    radial-gradient(2px   2px   at 92% 62%, rgba(255,255,255,0.8), transparent 60%),
    radial-gradient(1.3px 1.3px at 6%  84%, rgba(255,255,255,0.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 36% 90%, rgba(255,255,255,0.65), transparent 60%),
    radial-gradient(1.2px 1.2px at 64% 6%,  rgba(255,255,255,0.6), transparent 60%),
    /* туманності */
    radial-gradient(ellipse 55% 38% at 75% 15%, rgba(124,58,237,0.16), transparent 70%),
    radial-gradient(ellipse 45% 30% at 15% 70%, rgba(255,209,102,0.08), transparent 70%),
    radial-gradient(ellipse 60% 45% at 45% 105%, rgba(45,120,220,0.14), transparent 70%),
    /* глибокий космос */
    linear-gradient(180deg, #05070f 0%, #0a0e20 40%, #101731 75%, #131b38 100%);
  background-attachment: fixed;
}

/* ── Фон за порою дня. Атрибут data-tod ставить РАННІЙ скрипт до першого кадру,
   інакше вранці блимає ніч. Фази "night" тут немає свідомо: базовий body вже
   нічний, тож ніч і будь-яке невідоме значення дають космос вище.
   Сезонні межі — у todFor() нижче. Картки лишаються темними в усіх фазах. ── */
html[data-tod="morning"] body {
  background:
    radial-gradient(ellipse 60% 40% at 78% 12%, rgba(255,225,180,0.55), transparent 70%),
    radial-gradient(ellipse 50% 30% at 20% 8%, rgba(255,200,220,0.40), transparent 70%),
    linear-gradient(180deg, #ffd9a8 0%, #ffc2ac 16%, #eeb0c4 34%, #c3b6dd 54%, #a9c6e8 76%, #cfe6f5 100%);
  background-attachment: fixed;
}
html[data-tod="day"] body {
  background:
    radial-gradient(ellipse 520px 180px at 8% 16%, rgba(255,255,255,0.85), transparent 100%),
    radial-gradient(ellipse 300px 120px at 20% 11%, rgba(255,255,255,0.7), transparent 100%),
    radial-gradient(ellipse 460px 160px at 76% 10%, rgba(255,255,255,0.8), transparent 100%),
    radial-gradient(ellipse 280px 110px at 88% 6%, rgba(255,255,255,0.6), transparent 100%),
    radial-gradient(ellipse 360px 130px at 95% 42%, rgba(255,255,255,0.5), transparent 100%),
    linear-gradient(180deg, #6fb2e0 0%, #92c4e6 24%, #b2d6ef 48%, #cde6f6 70%, #e2f0fb 88%, #eef6fd 100%);
  background-attachment: fixed;
}
html[data-tod="evening"] body {
  background:
    radial-gradient(1.4px 1.4px at 22% 10%, rgba(255,255,255,0.7), transparent 60%),
    radial-gradient(1.2px 1.2px at 64% 6%,  rgba(255,255,255,0.6), transparent 60%),
    radial-gradient(1.3px 1.3px at 84% 14%, rgba(255,255,255,0.55), transparent 60%),
    radial-gradient(ellipse 80% 50% at 50% 118%, rgba(255,170,90,0.55), transparent 70%),
    linear-gradient(180deg, #1e1440 0%, #46285f 22%, #7b3a63 44%, #b85560 64%, #e0895a 84%, #f4b26e 100%);
  background-attachment: fixed;
}

/* ═══════════════════════════════════════════════════════════════════════════
   C. РОЗКЛАДКА — flex + три fixed-острови поза потоком
   ═══════════════════════════════════════════════════════════════════════════ */
/* opacity:0 доки лейаут не зібрано: інакше на hard-reload видно картку саму,
   а панелі «спалахують» поруч. Клас .ready ставить ініт + fallback на load. */
.layout {
  display: flex;
  align-items: stretch;
  justify-content: center;
  flex-wrap: wrap;
  gap: var(--gap-col);
  opacity: 0;
  transition: opacity 0.25s ease;
}
.layout.ready { opacity: 1; }

/* Компенсація, щоб ЦЕНТРАЛЬНА картка лишалась по центру екрана, коли ліва
   панель ширша за праву. Це формула, не магічне число. */
@media (min-width: 1500px) {
  .layout.shift-right    { margin-left: var(--shift); }
  .layout.balance-center { margin-right: var(--balance); }
}

/* ── Спільний вигляд бічних панелей і центральної картки ── */
.card, .panel {
  background: var(--surface-card);
  border: var(--bd-card);
  border-radius: var(--r-card);
  box-shadow: var(--sh-card);
}
.card  { width: var(--w-card); padding: var(--pad-card); }
.panel { padding: var(--pad-panel); }

#progress-panel {
  display: flex;
  flex-direction: column;
  width: var(--w-left);
  max-height: calc(100vh - 2 * var(--pad-page));
}
#open-panel {
  display: flex;
  flex-direction: column;
  width: var(--w-right);
  max-height: calc(100vh - 2 * var(--pad-page));
}

.panel-h  { font-size: 17px; font-weight: 700; color: var(--gold); margin: 0 0 2px; }
.panel-sub{ font-size: 12px; color: var(--tx-4); margin: 0 0 14px; }

/* Скрол усередині панелі — тонкий, це помітна частина «продуктовості» */
.scroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent;
}
.scroll::-webkit-scrollbar { width: 10px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.18); border-radius: var(--r-sm);
  border: 2px solid transparent; background-clip: padding-box;
  transition: background-color 0.2s ease;
}
.scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.34); background-clip: padding-box; }

.empty { color: var(--tx-5); font-size: 13px; line-height: 1.55; padding: 10px 2px; }

/* ═══════════════════════════════════════════════════════════════════════════
   D. ЦЕНТРАЛЬНА КАРТКА
   ═══════════════════════════════════════════════════════════════════════════ */
h1 {
  margin: 0 0 4px;
  font-size: 34px; font-weight: 800; letter-spacing: 1.5px; text-align: center;
  background: var(--grad-title);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--gold);
}
.sub { text-align: center; color: var(--tx-3); font-size: 13px; margin: 0 0 22px; }

/* — рядок «сьогодні» — */
.today-row {
  display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.chip {
  background: var(--solid-btn); border: var(--bd-chip); border-radius: var(--r-pill);
  padding: 6px 13px; font-size: 13px; color: var(--tx-1);
}
.chip b { color: var(--gold); font-weight: 700; }

/* — XP-блок — */
.xp-wrap { margin-bottom: 20px; }
.xp-row  { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.xp-hex {
  width: 46px; height: 46px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: var(--on-gold);
  background: linear-gradient(180deg, var(--lvl2, #e8eef7), var(--lvl, #9aa3b2));
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
}
.xp-meta { flex: 1 1 auto; min-width: 0; }
.xp-name { font-size: 14px; font-weight: 700; color: var(--tx-1); letter-spacing: 0.4px; }
.xp-nums { font-size: 12px; color: var(--tx-4); }
.xp-bar  {
  height: 10px; border-radius: var(--r-pill); overflow: hidden;
  background: rgba(255,255,255,0.09); border: var(--bd-ghost);
}
.xp-fill {
  height: 100%; border-radius: var(--r-pill);
  background: var(--grad-gold); box-shadow: var(--sh-glow);
  transition: width var(--t-data) ease;
}
.xp-league { text-align: right; font-size: 11px; color: var(--tx-5); letter-spacing: 1px; margin-top: 5px; }

/* — поле вводу + складності — */
.ask { font-size: 12px; color: var(--tx-4); margin: 0 0 7px; letter-spacing: 0.4px; }
.field {
  width: 100%; padding: 12px 14px; font-size: 16px; font-family: inherit;
  color: var(--tx); background: var(--solid-btn);
  border: var(--bd-accent); border-radius: var(--r-btn); outline: none;
  transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease;
}
.field::placeholder { color: var(--tx-6); }
.field:focus { border-color: var(--gold); box-shadow: var(--sh-glow); }

.dif-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
/* ⚠️ Тінт ПОВЕРХ солідної підкладки, не прозорість: інакше на світлих фазах
   доби кнопка вимивається. Тінт і бордер рахує hexToRgba() з кольору складності. */
.dif-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; font-size: 14px; font-family: inherit; text-align: left;
  color: var(--tx-1); cursor: pointer;
  background: linear-gradient(0deg, var(--dif-t), var(--dif-t)), var(--solid-btn);
  border: 1px solid var(--dif-b); border-radius: var(--r-btn);
  transition: transform var(--t-press) ease, box-shadow var(--t-fast) ease;
}
.dif-btn:hover  { box-shadow: 0 0 14px var(--dif-t); }
.dif-btn:active { transform: translateY(1px); }
.dif-btn .n   { flex: 1 1 auto; min-width: 0; }
.dif-btn .xp  { font-size: 12px; font-weight: 700; color: var(--dif); }

.hint { font-size: 11px; color: var(--tx-6); text-align: center; margin-top: 10px; }

/* ═══════════════════════════════════════════════════════════════════════════
   E. FIXED-ОСТРОВИ
   ═══════════════════════════════════════════════════════════════════════════ */
#wq-totals {
  position: fixed; right: var(--fix-inset); bottom: var(--fix-inset); z-index: 200;
  display: block;
  min-width: 216px; padding: 12px;
  background: var(--surface-fixed); border: var(--bd-fixed);
  border-radius: var(--r-box); box-shadow: var(--sh-fixed);
}
.tot-h { font-size: 10px; letter-spacing: 1.5px; color: var(--gold); text-align: center; margin-bottom: 8px; }
.tot-r { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; }
.tot-r + .tot-r { border-top: var(--bd-row); }
.tot-r .l { flex: 1 1 auto; min-width: 0; color: var(--tx-3); }
.tot-r .v { font-weight: 700; color: var(--tx-1); }

/* Термометр планів. pointer-events:none — він суто інформаційний
   і не має перехоплювати кліки лівої панелі. */
#thermo {
  position: fixed; left: var(--fix-inset); top: 50%; transform: translateY(-50%); z-index: 150;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 12px 14px; user-select: none; pointer-events: none;
  background: var(--surface-fixed); border: var(--bd-fixed);
  border-radius: var(--r-box); box-shadow: var(--sh-fixed);
}
.th-cap  { font-size: 9px; letter-spacing: 1.4px; color: var(--st-new); }
.th-plan { font-size: 11px; color: var(--tx-3); }
.th-tube {
  position: relative; width: 12px; height: 260px; border-radius: var(--r-pill);
  background: rgba(255,255,255,0.08); border: var(--bd-ghost); overflow: hidden;
}
.th-fill {
  position: absolute; left: 0; right: 0; bottom: 0; height: 0;
  border-radius: var(--r-pill);
  background: linear-gradient(180deg, var(--gold-hi), var(--st-new));
  transition: height var(--t-data) cubic-bezier(.34,1.2,.64,1);
}
.th-bulb {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(180deg, var(--gold-hi), var(--st-new));
  box-shadow: var(--sh-glow);
}

#bottom-left-btns {
  position: fixed; left: var(--fix-inset); bottom: var(--fix-inset); z-index: 200;
  display: flex; flex-direction: column; gap: 6px; width: max-content;
}
/* ⚠️ Фон СОЛІДНИЙ і в hover теж. В еталоні hover-правило лишилось напівпрозорим
   і кнопка при наведенні знову зникала на світлих фазах доби. */
.act {
  width: 100%; text-align: left;
  padding: 8px 13px; font-size: 13px; font-family: inherit;
  color: var(--tx-2); cursor: pointer;
  background: var(--solid-btn); border: var(--bd-accent); border-radius: var(--r-btn);
  transition: color var(--t-fast) ease, background-color var(--t-fast) ease;
}
.act:hover { background: var(--solid-btn-hov); color: var(--gold); }


/* ═══════════════════════════════════════════════════════════════════════════
   E2. ОВЕРЛЕЙ «СХОДИ РІВНІВ»
   Клік по XP-блоку відкриває повний список 100 рівнів, згрупованих по лігах.
   ⚠️ Кольори лiг рахує hexToRgba() з реєстру LEAGUES, а не color-mix():
   color-mix вимагає Chrome 111+, а тінт нам потрібен і як фон, і як межа, і як
   сяйво — простіше й надійніше порахувати три rgba один раз при рендері.
   ═══════════════════════════════════════════════════════════════════════════ */
#xp-section {
  cursor: pointer; border-radius: var(--r-btn);
  padding: 6px 8px; margin: -6px -8px 14px;
  transition: background-color var(--t-fast) ease;
}
#xp-section:hover { background: rgba(255,209,102,0.07); }

#levels-overlay, #records-overlay {
  position: fixed; inset: 0; z-index: 300;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  background: var(--scrim);
}

.sheet {
  width: 640px; max-width: 96vw; height: 86vh;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface-sheet);
  border: 1px solid rgba(255,209,102,0.32);
  border-radius: var(--r-card);
  box-shadow: 0 30px 80px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,209,102,0.14);
}
.sheet-head {
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  padding: 16px 22px; border-bottom: 1px solid rgba(255,255,255,0.12);
}
.sheet-head h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--gold); }
.sheet-head .sh-sub { font-size: 12px; color: var(--tx-4); }
.sheet-close {
  margin-left: auto; background: none; border: none; cursor: pointer;
  color: var(--tx-4); font-size: 22px; line-height: 1; padding: 2px 6px;
  transition: color var(--t-fast) ease;
}
.sheet-close:hover { color: var(--tx); }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 22px 24px; }

/* — чипси періодів (оверлей рекордів) — */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip-btn {
  font-size: 12px; font-family: inherit; color: var(--tx-3); cursor: pointer;
  background: var(--solid-btn); border: var(--bd-ghost); border-radius: var(--r-pill);
  padding: 6px 13px;
  transition: color var(--t-fast) ease, border-color var(--t-fast) ease, background-color var(--t-fast) ease;
}
.chip-btn:hover { color: var(--gold); border-color: rgba(255,209,102,0.4); }
.chip-btn.on {
  color: var(--on-gold); font-weight: 700;
  background: var(--grad-gold); border-color: transparent; box-shadow: var(--sh-glow);
}

/* — заголовок ліги — */
.lg-head {
  display: flex; align-items: baseline; gap: 8px;
  margin: 18px 0 8px; padding-bottom: 6px;
  font-size: 14px; font-weight: 800; letter-spacing: 0.6px;
  color: var(--lg); border-bottom: 1px solid var(--lg-b);
}
.lg-head:first-child { margin-top: 0; }

<!-- ═══════════════════════════════════════════════════════════════════════════
     РАННІЙ СКРИПТ — виконується ДО config.js і головного скрипта.
     Без залежностей, тож переживе будь-яку помилку нижче.
     ═══════════════════════════════════════════════════════════════════════════ -->
<script>
// Страховка: показати лейаут на window load, навіть якщо головний скрипт
// кинув помилку до свого reveal-виклику. Дешева ціна за «не порожній екран».
addEventListener("load", function () {
  var l = document.querySelector(".layout");
  if (l) l.classList.add("ready");
});

// ── Фон за порою дня З СЕЗОНАМИ (українські широти) ──
// Ставимо data-tod ДО завантаження даних → правильний фон з першого кадру, без блимання.
// B = ПОЧАТКИ фаз [ранок, день, вечір, ніч] за сезоном.
// ⚠️ Перевірка ночі йде ПЕРШОЮ і двобічна (h >= B[3] || h < B[0]) — ніч обгортається
//    через опівніч, гілки міняти місцями не можна.
// ⚠️ Весна й осінь мають однакові межі свідомо — так їх легше правити окремо.
function todFor(m, h) {
  var B = (m === 12 || m <= 2) ? [7, 9, 15, 17]    // зима
        : (m <= 5)             ? [6, 8, 18, 21]    // весна
        : (m <= 8)             ? [5, 7, 20, 23]    // літо
        :                        [6, 8, 18, 21];   // осінь
  return (h >= B[3] || h < B[0]) ? "night" : h < B[1] ? "morning" : h < B[2] ? "day" : "evening";
}
function todNow() {
  var d = new Date();
  return todFor(d.getMonth() + 1, d.getHours());
}
(function () {
  // ?tod=morning|day|evening|night — примусова фаза для перевірки вигляду.
  var force = new URLSearchParams(location.search).get("tod");
  document.documentElement.dataset.tod = force || todNow();
  if (!force) setInterval(function () { document.documentElement.dataset.tod = todNow(); }, 10 * 60 * 1000);
})();

// ── Проба сховища: у приватному режимі setItem кидає виняток ──
// Пишемо результат у прапор, щоб головний скрипт не гадав, а показав банер.
var LS_OK = (function () {
  try {
    var k = "__wq_probe";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    return true;
  } catch (e) {
    console.warn("[storage] localStorage недоступний:", e && e.name);
    return false;
  }
})();
</script>

<script src="config.js"></script>
<script src="tasks.js"></script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     ГОЛОВНИЙ СКРИПТ
     ⚠️ Порядок блоків §0–§11 жорсткий — це запобіжник від TDZ. Усі константи
     ключів оголошуються в §0, до будь-якого виклику. Етап 0: каркас.
     ═══════════════════════════════════════════════════════════════════════════ -->
<script>
/* ─── §0 · КЛЮЧІ СХОВИЩА ───────────────────────────────────────────────────
   ⚠️ Новий ключ додається ТІЛЬКИ сюди. BACKUP_KEYS генерується з реєстру, тож
   баг «забув додати ключ у бекап» неможливий за побудовою.
   klass впливає лише на пост-імпортні виправлення; у копію за вимогою ТЗ
   потрапляють УСІ ключі — інакше після відновлення губились би налаштування
   панелей, вимикач звуку і здобуті ліги досягнень.                        */
const WQ_KEYS = {
  meta:      { key: "workquest_meta_v1",         klass: "data" },
  tasks:     { key: "workquest_tasks_v1",        klass: "data" },
  difs:      { key: "workquest_difficulties_v1", klass: "data" },
  plan:      { key: "workquest_plan_v1",         klass: "data" },
  ach:       { key: "workquest_ach_v1",          klass: "data" },
  eventLog:  { key: "workquest_event_log_v1",    klass: "data" },
  trash:     { key: "workquest_trash_v1",        klass: "data" },

  recBest:   { key: "workquest_records_best_v1", klass: "derived" },
  levelupAt: { key: "workquest_levelup_at_v1",   klass: "derived" },
  backupAt:  { key: "workquest_backup_date_v1",  klass: "derived" },

  progOpen:  { key: "workquest_prog_open_v1",    klass: "ui" },
  recOpen:   { key: "workquest_rec_open_v1",     klass: "ui" },
  recPeriod: { key: "workquest_rec_period_v1",   klass: "ui" },
  lastDif:   { key: "workquest_last_dif_v1",     klass: "ui" },
  sfx:       { key: "workquest_sfx_v1",          klass: "ui" },

  seeded:    { key: "workquest_seed_v1",         klass: "flag" }
};
const K = Object.fromEntries(Object.entries(WQ_KEYS).map(([n, d]) => [n, d.key]));
const BACKUP_KEYS = Object.values(WQ_KEYS).map(d => d.key);

/* ⚠️ Порожній catch заборонений: він маскує TDZ як «дані зникли». Скрізь логуємо. */
function lsGet(key, def) {
  try { const v = localStorage.getItem(key); return v === null ? def : v; }
  catch (e) { console.error("[storage] getItem " + key, e); return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, val); return true; }
  catch (e) {
    console.error("[storage] setItem " + key, e && e.name);
    // Гучно, а не тихо: мовчазний catch тут = мовчазна втрата даних користувача.
    if (e && (e.name === "QuotaExceededError" || e.code === 22)) alert(WQ_TEXT.errQuota);
    return false;
  }
}
function loadJSON(key, def) {
  const raw = lsGet(key, null);
  if (raw === null) return def;
  try { const v = JSON.parse(raw); return v === null ? def : v; }
  catch (e) { console.error("[storage] битий JSON у " + key, e); return def; }
}
function loadTasks() { const a = loadJSON(K.tasks, []); return Array.isArray(a) ? a : []; }

/* ⚠️ ЄДИНЕ джерело XP у проєкті — сума ЗАМОРОЖЕНИХ xpAwarded.
   Ключа workquest_xp_v1 не існує і не має існувати: інакше зміна XP у реєстрі
   складностей заднім числом переписала б усю історію. */
function totalXp() {
  return loadTasks().reduce((s, t) => s + (typeof t.xpAwarded === "number" ? t.xpAwarded : 0), 0);
}

/* ─── §2 · ДРІБНІ ХЕЛПЕРИ ───────────────────────────────────────────────── */
const $ = id => document.getElementById(id);

// ⚠️ Назву й нотатку задачі вводить користувач — у DOM лише через esc().
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Колір складності задає користувач пікером, а тінт і бордер потрібні окремо.
// Без цього кольорову кнопку на змінному фоні доби зробити не можна.
function hexToRgba(hex, a) {
  const h = String(hex || "").replace("#", "");
  const v = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  const n = parseInt(v, 16);
  if (!isFinite(n) || v.length !== 6) return "rgba(255,255,255," + a + ")";
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
}

/* ─── §5 · РІВНІ ────────────────────────────────────────────────────────────
   Рівень НІКОЛИ не зберігається — завжди обчислюється з xp.total. Саме тому
   криву LEVELS можна перекалібрувати будь-коли без міграції даних.          */

// Кожна ліга — 10 рівнів, тож рівень усередині ліги отримує римський номер:
// «Новачок I» … «Новачок X», далі «Підмайстер I». Так у кожного зі 100 рівнів
// є власне ім'я, і при цьому не треба вигадувати 100 назв.
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const PER_LEAGUE = Math.max(1, Math.round(LEVELS.length / LEAGUES.length));

function leagueOf(n) { return LEAGUES[Math.min(LEAGUES.length - 1, Math.floor((n - 1) / PER_LEAGUE))]; }
function levelName(n) { return leagueOf(n).name + " " + (ROMAN[(n - 1) % PER_LEAGUE] || ""); }

// Розряди — вузьким нерозривним пробілом: 252 000 не переноситься і не злипається.
function fmtXpNum(n) { return String(n | 0).replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f"); }

function getLevelInfo(xp) {
  let i = 0;
  for (let k = LEVELS.length - 1; k >= 0; k--) { if (xp >= LEVELS[k]) { i = k; break; } }
  const isMax = i === LEVELS.length - 1;
  const cur = LEVELS[i];
  const next = isMax ? cur : LEVELS[i + 1];
  // ⚠️ На максимальному рівні pct = 100 ЯВНО. Формула дала б 0/0 = NaN,
  // а `width: NaN%` — це смужка, що зникає рівно в момент найбільшого досягнення.
  const pct = isMax ? 100 : Math.max(0, Math.min(100, ((xp - cur) / (next - cur)) * 100));
  return {
    n: i + 1, name: levelName(i + 1), league: leagueOf(i + 1),
    xp, cur, next, isMax, pct,
    xpInLevel: xp - cur, xpToNext: isMax ? 0 : next - xp
  };
}

/* ─── §10 · РЕНДЕР ──────────────────────────────────────────────────────────
   ⚠️ Реєстр зон. Додав панель → дописав СЮДИ, а не в обробники. У еталоні
   панель тихо не оновлювалась, бо в одному з обробників забули рядок.
   Етап 0 малює статичний каркас із реєстрів; дані з'являться на етапі 1.   */
const RENDER = {
  today:  renderToday,
  xp:     renderXp,
  difs:   renderDifRow,
  totals: renderTotals,
  days:   renderDays,
  open:   renderOpen
};
function refresh(...zones) {
  for (const n of (zones.length ? zones : Object.keys(RENDER))) RENDER[n]();
}

function renderXp() {
  const info = getLevelInfo(totalXp());
  const hex = $("xp-hex");
  hex.textContent = info.n;
  hex.style.setProperty("--lvl", info.league.color);
  hex.style.setProperty("--lvl2", info.league.color2);
  $("xp-name").textContent = info.name.toUpperCase();
  $("xp-nums").textContent = info.isMax
    ? fmtXpNum(info.xp) + " XP · максимум"
    : fmtXpNum(info.xp) + " / " + fmtXpNum(info.next) + " XP";
  $("xp-fill").style.width = info.pct + "%";
  $("xp-league").textContent = info.league.icon + " ЛІГА · " + info.league.name.toUpperCase();
}

function renderToday() {
  // ⚠️ Збірка HTML — ТІЛЬКИ масивом і .join(""). Ланцюжок через '+' ламається
  // від коментаря в кінці рядка: '+' з'їдається, і половина панелі тихо зникає.
  const h = [
    '<span class="chip">Сьогодні: <b>0</b> задач</span>',
    '<span class="chip"><b>0</b> XP</span>',
    '<span class="chip">🔥 серія <b>0</b></span>'
  ];
  $("today-row").innerHTML = h.join("");
}

function renderDifRow() {
  const h = [];
  for (const d of DEFAULT_DIFFICULTIES.filter(x => !x.archived).sort((a, b) => a.order - b.order)) {
    const st = [
      "--dif:", d.color, ";",
      "--dif-t:", hexToRgba(d.color, 0.13), ";",
      "--dif-b:", hexToRgba(d.color, 0.34), ";"
    ].join("");
    h.push(
      '<button class="dif-btn" data-dif="', esc(d.id), '" style="', st, '">',
      '<span>', esc(d.icon), '</span>',
      '<span class="n">', esc(d.name), '</span>',
      '<span class="xp">+', d.xp | 0, '</span>',
      '</button>'
    );
  }
  $("dif-row").innerHTML = h.join("");
}

function renderTotals() {
  const rows = [
    ["✅", "Задач виконано", "0"],
    ["⚡", "Усього XP", "0"],
    ["📆", "Днів активності", "0"],
    ["🔥", "Поточна серія", "0"],
    ["📊", "Сер. задач/день", "0"],
    ["📊", "Сер. задач/місяць", "0"],
    ["🗓", "Найкращий день тижня", "—"]
  ];
  const h = [];
  for (const [ic, label, val] of rows) {
    h.push('<div class="tot-r"><span>', ic, '</span><span class="l">', esc(label),
           '</span><span class="v">', esc(val), '</span></div>');
  }
  $("tot-list").innerHTML = h.join("");
}

function renderDays() { $("prog-list").innerHTML = '<div class="empty">' + esc(EMPTY_STATES.days) + '</div>'; }

// Права колонка — задачі, які ще в роботі. Заголовок несе лічильник, щоб
// колонка не читалась як список боргів: число видно, докору немає.
function renderOpen() {
  const open = loadTasks().filter(t => !(typeof t.doneAt === "number" && t.doneAt > 0));
  $("open-h").textContent = "📋 Поточні задачі" + (open.length ? " · " + open.length : "");
  $("open-list").innerHTML = open.length
    ? ""
    : '<div class="empty">' + esc(EMPTY_STATES.open) + '</div>';
}

/* ─── §11 · РОЗКЛАДКА ТА ІНІЦІАЛІЗАЦІЯ ───────────────────────────────────── */
// Компенсація зсуву: коли обидві бічні панелі видимі, ліва (440) ширша за
// праву (420), і центральна картка з'їжджала б на 10px вправо.
function updateLayoutAlign() {
  const layout = document.querySelector(".layout");
  if (!layout) return;
  const progHidden = $("progress-panel").classList.contains("hidden");
  const rightVisible = !$("open-panel").classList.contains("hidden");
  layout.classList.toggle("shift-right", rightVisible && progHidden);
  layout.classList.toggle("balance-center", rightVisible && !progHidden);
}
addEventListener("resize", () => requestAnimationFrame(updateLayoutAlign));

/* ── Оверлей «Сходи рівнів» ──
   Клік по XP-блоку відкриває всі 100 рівнів: згори максимум, знизу перший —
   як на сходах. Рівні згруповані по лігах, колір ліги фарбує бейдж, межу
   й сяйво рядка. Поточний рівень підсвічений і в нього скролиться список. */
function openLevels() {
  const info = getLevelInfo(totalXp());

  $("lvl-sub").textContent = LEVELS.length + " рівнів · " + LEAGUES.length + " ліг · зараз "
    + info.name + (info.isMax ? "" : " · до наступного " + fmtXpNum(info.xpToNext) + " XP");

  // ⚠️ Збірка ТІЛЬКИ масивом і .join(""). Ланцюжок через '+' ламається від
  // коментаря в кінці рядка: '+' з'їдається, і половина списку тихо зникає.
  const h = ['<div class="lvl-list">'];

  for (let li = LEAGUES.length - 1; li >= 0; li--) {
    const lg = LEAGUES[li];
    const from = li * PER_LEAGUE + 1;
    const to = Math.min(LEVELS.length, from + PER_LEAGUE - 1);

    h.push(
      '<div class="lg-head" style="--lg:', lg.color, ';--lg-b:', hexToRgba(lg.color, 0.35), '">',
      lg.icon, ' ', esc(lg.name),
      '<span class="lg-range">рівні ', from, '–', to, ' · від ', fmtXpNum(LEVELS[from - 1]), ' XP</span>',
      '</div>'
    );

    for (let n = to; n >= from; n--) {
      const cls = 'lvl-row' + (n === info.n ? ' cur' : (n > info.n ? ' future' : ''));
      const st = [
        '--lg:', lg.color,
        ';--lg2:', lg.color2,
        ';--lg-t:', hexToRgba(lg.color, 0.10),
        ';--lg-s:', hexToRgba(lg.color, 0.26),
        ';--lg-b:', hexToRgba(lg.color, 0.42),
        ';--lg-g:', hexToRgba(lg.color, 0.38)
      ].join('');
      h.push(
        '<div class="', cls, '" style="', st, '">',
        '<span class="lvl-num">', n, '</span>',
        '<span class="lvl-ic">', lg.icon, '</span>',
        '<span class="lvl-name">', esc(levelName(n)),
        (n === info.n ? '<span class="lvl-you">ти тут · ' + fmtXpNum(info.xp) + ' XP</span>' : ''),
        '</span>',
        '<span class="lvl-xp">', fmtXpNum(LEVELS[n - 1]), ' XP</span>',
        '</div>'
      );
    }
  }
  h.push('</div>');

  $("lvl-body").innerHTML = h.join("");
  $("levels-overlay").classList.remove("hidden");

  const cur = $("lvl-body").querySelector(".lvl-row.cur");
  if (cur) cur.scrollIntoView({ block: "center" });
}
function closeLevels() { $("levels-overlay").classList.add("hidden"); }

$("xp-section").addEventListener("click", openLevels);
$("levels-overlay").addEventListener("click", e => {
  // Закриття по кліку на затемнення або на ✕ — без окремих обробників на кожен.
  if (e.target === $("levels-overlay") || e.target.closest('[data-act="close"]')) closeLevels();
});
addEventListener("keydown", e => { if (e.key === "Escape") { closeLevels(); closeRecords(); } });

/* ── Оверлей «Рекорди» ──
   Рішення сесії 1: рекорди живуть окремим оверлеєм, а права колонка віддана
   поточним задачам. Чипси періодів працюють уже зараз (обраний період
   зберігається); самі рекорди наповняться, коли з'явиться S() і історія. */
function renderRecChips() {
  const cur = lsGet(K.recPeriod, DEFAULT_PERIOD);
  const h = [];
  for (const p of PERIODS) {
    h.push('<button class="chip-btn', (p.id === cur ? ' on' : ''), '" data-period="', esc(p.id), '">',
           esc(p.label), '</button>');
  }
  $("rec-chips").innerHTML = h.join("");
  $("rec-list").innerHTML = '<div class="empty">' + esc(EMPTY_STATES.records) + '</div>';
}
function openRecords() { renderRecChips(); $("records-overlay").classList.remove("hidden"); }
function closeRecords() { $("records-overlay").classList.add("hidden"); }

$("records-btn").addEventListener("click", openRecords);
$("records-overlay").addEventListener("click", e => {
  if (e.target === $("records-overlay") || e.target.closest('[data-act="close"]')) { closeRecords(); return; }
  const chip = e.target.closest("[data-period]");
  if (!chip) return;
  lsSet(K.recPeriod, chip.dataset.period);
  renderRecChips();
});

function init() {
  $("app-title").textContent = WQ_TEXT.appTitle;
  $("app-sub").textContent   = WQ_TEXT.appSub;
  $("ask-label").textContent = WQ_TEXT.askDone.toUpperCase();
  $("add-hint").textContent  = WQ_TEXT.addHint;
  $("th-goal").textContent   = DEFAULT_PLAN.perDay + " з.";

  if (!LS_OK) console.warn(WQ_TEXT.errPrivate);

  refresh();

  requestAnimationFrame(() => {
    updateLayoutAlign();
    document.querySelector(".layout").classList.add("ready");
  });
}

init();
</script>
</body>
</html>
